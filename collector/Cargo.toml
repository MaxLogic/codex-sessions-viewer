[package]
name = "codex-sessions-collector"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
description = "Collects local Codex sessions into the Codex Sessions Viewer database."

[[bin]]
name = "codex-sessions-collector"
path = "src/main.rs"

[dependencies]
httparse = "1.10.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value", "unbounded_depth"] }
serde_stacker = "0.1.14"
sha2 = "0.11.0"
toml = "1.1.6"
toml_edit = "0.25"
tiny_http = "0.12.0"
ureq = { version = "3.4.2", features = ["json"] }
zstd = { version = "0.14.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Performance"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
