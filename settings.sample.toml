# Distribution defaults. Configure your session folders in Settings after launch.
# Omitted options use application defaults. This file must never contain secrets.

[app]
first_run = true
start_with_windows = false

[paths]
windows_codex_path = ''
wsl_codex_unc_path = ''

[wsl]
distro = ''
linux_home = ''
linux_root_unc = ''

[scanner]
background_rescan_enabled = false

[terminal]
default_terminal = 'windows_terminal'

# Public model prices refresh at 00:00, 06:00, 12:00 and 18:00 UTC. Only the
# public OpenRouter model catalog is downloaded; it needs no API key, and no
# session data is sent.
[pricing]
use_external_pricing = true
automatic_refresh_enabled = true
refresh_interval_hours = 6
refresh_utc_slots = true

[pricing.openrouter]
api_key = ''

# Optional personal hub, used to browse hub sessions and share price history.
# Credentials never belong here: price sync reads the machine token from the
# CODEX_SESSIONS_HUB_MACHINE_TOKEN environment variable.
[hub]
url = ''
machine = ''
